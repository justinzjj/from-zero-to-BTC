 ['B 已清出','B:0 · 60,000 ／ B:1 · 39,000','60,000 聪 · 1 次确认'],
 ['待按新链重查','U 恢复 · 100,000 聪','B 的旧确认撤销'],
 ['B 冲突，无法入池','U 已由 C 花掉，留下 C 的输出','B 冲突 · 书款失去确认']
];
let page=0,frame=0;
const btn=(label,action)=>{const b=document.createElement('button');b.textContent=label;b.onclick=action;return b};
function inspect(title,values){
 el('dtitle').textContent=title;
 const dl=document.querySelector('dl');dl.replaceChildren();
 ['收到什么','怎样检查或计算','哪份状态改变','失败或分支变化'].forEach((t,i)=>{
 const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=t;dd.textContent=values[i];dl.append(dt,dd)});
 el('info').showModal();
}
function draw(){
 const {nodes,edges}=maps[page];
 const marker='<defs><marker id="arrow" orient="auto-start-reverse" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0L8 4L0 8Z" fill="#50708d"/></marker></defs>';
 el('map').innerHTML=marker+edges.map(([d,x,y,l,both])=>
 '<path class="wire" d="'+d+'" marker-end="url(#arrow)" '+(both?'marker-start="url(#arrow)"':'')+'/>'+
 '<text class="edge" text-anchor="middle" x="'+x+'" y="'+y+'">'+l+'</text>').join('')+
 nodes.map(([id,x,y,c])=>'<g class="station '+c+'" tabindex="0" role="button" aria-label="展开'+items[id][0]+'" data-id="'+id+'" transform="translate('+x+' '+y+')"><rect x="-116" y="-34" width="232" height="68" rx="10"/><text text-anchor="middle" y="-3" font-size="24" font-weight="700">'+items[id][0]+'</text><text text-anchor="middle" class="small" y="21">'+items[id][1]+'</text></g>').join('');
 document.querySelectorAll('.station').forEach(g=>{const a=items[g.dataset.id];g.onclick=()=>inspect(a[0],a.slice(2));g.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();g.onclick()}}});
 el('prompt').textContent=page?'B 入池时，哪个组件读 U？哪个组件以后才会删掉 U？':'Bob 同时担任哪些角色？普通份额最终交给谁？';
}
function play(i){
 frame=Math.max(0,Math.min(i,8));
 const s=stages[frame],step=Math.min(frame,6);
 ['moment','sender','message','receiver','question'].forEach((id,k)=>el(id).textContent=s[k]);
 el("payment").hidden=frame!==1;
 const state=status[frame<3?0:frame<5?1:frame<7?2:frame===7?3:4];
 ['pool','coins','wallet'].forEach((id,k)=>el(id).textContent=state[k]);
 document.querySelectorAll('.steps button').forEach((b,k)=>b.setAttribute('aria-pressed',k===step));
 document.querySelectorAll('.sub button').forEach((b,k)=>{b.hidden=frame<6;b.setAttribute('aria-pressed',frame===6+k)});
 el('position').textContent='第 '+(step+1)+' / 7 步'+(frame>=6?'　·　第 '+(frame-5)+' / 3 幕':'');
 el('prev').disabled=frame===0;el('next').disabled=frame===8;
 el('detail').onclick=()=>inspect(items[s[5]][0]+' · '+labels[step],s.slice(6));
}
function show(i){
 page=i;el('title').textContent=heads[i];el('lead').textContent=leads[i];
 document.querySelectorAll('nav button').forEach((b,k)=>b.setAttribute('aria-pressed',i===k));
 el('diagram').hidden=i===2;el('journey').hidden=i!==2;
 if(i===2)play(frame);else draw();
}
names.forEach((s,i)=>document.querySelector('nav').append(btn(s,()=>show(i))));
labels.forEach((s,i)=>document.querySelector('.steps').append(btn((i+1)+' '+s,()=>play(i))));
['兄弟分支','断开旧块','接入新链'].forEach((s,i)=>document.querySelector('.sub').append(btn(s,()=>play(i+6))));
el('prev').onclick=()=>play(frame-1);el('next').onclick=()=>play(frame+1);
document.querySelector('.close').onclick=()=>el('info').close();
document.addEventListener('keydown',e=>{
 if(el('info').open||e.altKey||e.ctrlKey||e.metaKey)return;
 if(['1','2','3'].includes(e.key))show(Number(e.key)-1);
 if(page===2&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();play(frame+(e.key==='ArrowRight'?1:-1))}
});
if(!document.fullscreenEnabled)el('full').hidden=true;
el('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange',()=>el('full').textContent=document.fullscreenElement?'退出全屏':'⛶ 全屏');
show(0);
</script></html>
