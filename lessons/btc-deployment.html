$('platforms').innerHTML+=heading(35,38,'Alice · 轻用户','手机上运行独立钱包')+heading(334,38,'Bob · 全节点用户','自己的电脑负责验证与收款')+heading(715,38,'挖矿方 · 矿池与矿场','池内三个职责，池外矿机接作业');
const units={
 aw:[143,148,'phone','独立钱包','保存收款信息、选择旧输出 U，用 Alice 的私钥签署 B。这里通过接入全节点广播交易。'],
 bw:[400,150,'phone','钱包','生成收款地址，识别 B:0 的 60,000 聪，按自己的全节点通知显示入池、确认或冲突。'],
 bn:[572,150,'server','全节点','维护本地内存池、活动链和 UTXO。独立验交易与区块，并把相关事件交给同机钱包。'],
 an:[264,324,'server','接入全节点','Alice 使用的网络接入服务。接收 B、查输入和签名，按本地策略入池，然后向邻居中继。'],
 pn:[788,151,'server','全节点','矿池自营的全节点。验证交易与区块，提供链尖和池内交易；完整候选块也要经过验证。'],
 pt:[934,151,'stack','模板构造','从当前链尖和本地池挑可一起执行的交易，处理依赖、重量、费用和奖励交易。此职责可与全节点同进程。'],

 rig:[1002,335,'rig','矿场 · ASIC 矿机','池外矿场运行控制器与 ASIC。控制器准备候选头，芯片搜索 nonce，控制器把命中参数交回矿池。矿场与矿池可以分别运营。']
};

 return '<g class="unit" role="button" aria-label="查看'+label+'" tabindex="0" data-id="'+id+'" transform="translate('+x+' '+y+')">'+art+'<text class="label" text-anchor="middle" y="53">'+label+'</text></g>';
}

document.querySelectorAll('.unit').forEach(g=>{const u=units[g.dataset.id];g.onclick=()=>{
 const lessons={aw:['wallet','钱包'],bw:['wallet','钱包'],an:['full-node','全节点'],bn:['full-node','全节点'],pn:['full-node','全节点'],pt:['miner','矿机'],pc:['miner','矿机'],rig:['miner','矿机']};
 const [slug,label]=lessons[g.dataset.id];
 $('open-lesson').href='btc-'+slug+'.html?theme='+document.documentElement.dataset.theme;
 $('open-lesson').textContent='打开'+label+'课件 →';
 $('part').textContent=u[3];$('inside').textContent=u[4];$('inspect').showModal()};g.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();g.onclick()}}});
const colors={address:'var(--p2p)',tx:'var(--wire)',local:'var(--event)',job:'var(--state)',block:'var(--block)'};
const flow=[
 ['报价','address','Bob 的钱包 → Alice 的钱包','Bob 展示付款二维码，Alice 扫码得到收款地址和 60,000 聪书价。',[['M378 135H181','收款地址 · 60,000 聪',273,122]],[
  'Bob 的钱包从自己的收款密钥派生公钥，生成本次收款地址，并保存识别这个收款脚本所需的资料。',
  'Bob 把地址和书价交给 Alice。Alice 核对收款要求；此时双方交换的是付款信息，交易 B 将由 Alice 的手机构造。']],
 ['构造、签名并提交 B','tx','Alice 的钱包 → 接入全节点','花费 U 100,000 聪 ｜ B:0 书款 60,000 聪 ｜ B:1 找零 39,000 聪 ｜ 手续费 1,000 聪',[['M141 210V296H222','交易 B（含见证）',158,273]],[
  '读取付款请求。钱包检查地址适用于当前网络，将 Bob 的地址转换为收款脚本，并读取书价 60,000 聪。',
  '选择旧输出。钱包此前已同步产生 U 的前序交易，认出 U 归 Alice 控制。它从可花费的输出中选出价值 100,000 聪的 U，用前序交易标识和输出序号引用它。',
  '计算找零。钱包按预计交易大小和费率估费。本例给定费用 1,000 聪，找零为 100,000 − 60,000 − 1,000 = 39,000 聪。钱包为找零准备 Alice 自己控制的脚本。',
  '构造 B。一个输入引用整个 U。第一个输出 B:0 将 60,000 聪锁给 Bob，第二个输出 B:1 将 39,000 聪锁给 Alice。输入与输出总额的差就是手续费。',
  '签名并装入见证。本例花费原生 P2WPKH 输出。钱包按 BIP143 计算摘要，其中用到 U 的金额和对应的签名脚本。SIGHASH_ALL 绑定两个新输出。Alice 用控制 U 的私钥签名，将签名（附模式字节 01）和公钥装入输入的见证。此后若改动书价，原签名就无法通过验证。',
  '登记并发出。钱包记录付款和自己的找零，把完整的带见证交易 B 发给接入全节点。图上箭头表示这次发送，私钥留在手机里。',
  '接入节点检查。节点查 U 是否可花，用 U 的锁定条件和 B 的见证验签，核对金额、费用及本地入池策略。本例通过检查，B 进入该节点的内存池，仍为 0 次确认。'],[
  [143,235,'选 U · 构造 B · 签名'],[264,410,'查 U、验签、入池']]],
 ['中继 B','tx','接入全节点 → Bob 的全节点、矿池全节点','从这里分两路观察：④ 看 Bob 的待确认收款，⑤→⑥ 看矿池准备挖矿。两侧独立推进。',[['M302 317H572V216','交易 B',478,308],['M302 330H788V218','交易 B',723,321]],[
  '接入节点向邻居通告交易标识。尚缺 B 的邻居可以请求交易数据，再沿网络继续中继。两条亮线表示同一笔 B 的两条可能传播路径。',
  'Bob 的节点和矿池节点各自收到 B、核对输入与见证，并按各自的策略决定是否接纳。本例两端均接纳，到达时刻可以不同。',
  '矿池收到 B 后就可以选它组模板。即使矿场已开始试算，Bob 的钱包也可能稍后才收到本机的入池通知。']],
 ['通知入池','local','Bob 的全节点 → Bob 的钱包','Bob 收款侧 · 本机钱包第一次识别出这笔待确认书款。',[['M536 152H436','B 已入池',486,138]],[
  'Bob 的节点接纳 B，在本机内存池登记 B 正在花费 U。此时活动链的未花费输出集合（UTXO）里仍有 U。',
  '节点把入池交易交给同机钱包。钱包逐个检查输出脚本，认出 B:0 属于 Bob，登记一笔 60,000 聪收款，显示 0 次确认。',
  '这条本地通知只影响 Bob 看到的状态。矿池可独立开始第 5 步。'],[[400,236,'书款 60,000 聪 · 0 次确认']]],
 ['组模板','local','矿池全节点 → 模板构造 → 作业协调','矿池侧 · 从第 3 步的另一条路径接着看。矿池全节点已接纳 B。',[['M800 209V245H934V209','链尖、池内交易',864,266],['M945 208V233H1080V208','含 B 的模板',1020,256]],[
  '矿池全节点提供当前链尖和本地内存池中的候选交易。模板构造服务据此确定父块，检查交易依赖、费用和可用块空间，本次选入 B。',
  '构造服务排好交易顺序，准备领取补贴与手续费的首笔交易（coinbase），把含 B 的模板交给作业协调服务。',

 ['下发作业','job','矿池作业协调 → 矿场控制器','矿池发作业，控制器准备区块头，ASIC 芯片在矿场内反复试算。',[['M1080 209V281H1002V299','J · 构头参数 · 份额目标',1064,272]],[

const dashes={address:'3 6',tx:'',local:'6 4',job:'14 5',block:''};
// Steps 4 and 10 carry different notifications on the same local connection.
const drawnRoutes = new Set();
for (const [, kind, , , paths] of flow) {
 for (const [geometry] of paths) {
  if (drawnRoutes.has(geometry)) continue;
  drawnRoutes.add(geometry);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', geometry);
  path.setAttribute('marker-end', 'url(#context-tip)');
  if (dashes[kind]) path.setAttribute('stroke-dasharray', dashes[kind]);
  $('context-routes').append(path);
 }
}
let activeFlow=introFlow;
let index=0;
function show(i){
 index=Math.max(0,Math.min(activeFlow.length-1,i));const [name,kind,title,detail,paths,explanation,notes=[]]=activeFlow[index],c=colors[kind];
 $('arrow').setAttribute('fill',c);$('routes').innerHTML=paths.map(([d])=>'<path d="'+d+'" stroke="var(--canvas)" stroke-width="9" fill="none"/><path d="'+d+'" stroke="'+c+'" stroke-width="'+(kind==='block'?5:3.5)+'" stroke-dasharray="'+dashes[kind]+'" fill="none" marker-end="url(#tip)"/>').join('');
 $('tags').innerHTML=paths.map(([,s,x,y])=>'<text class="signal" text-anchor="middle" x="'+x+'" y="'+y+'" style="fill:'+c+'">'+s+'</text>').join('');
 for(const [x,y,label] of notes){
  const note=document.createElementNS('http://www.w3.org/2000/svg','text');
  note.setAttribute('class','signal');note.setAttribute('text-anchor','middle');
  note.setAttribute('x',x);note.setAttribute('y',y);note.textContent=label;$('tags').append(note);
 }
 $('explanation').replaceChildren(...explanation.map(line=>{
  const item=document.createElement('li');item.textContent=line;return item;
 }));
 $('route').textContent=title;$('data').textContent=detail;document.querySelector('.readout').style.setProperty('--color',c);
 Array.from($('steps').querySelectorAll('button')).forEach((b,k)=>b.setAttribute('aria-pressed',k===index));
}
function stepArrow(){
 const arrow=document.createElement('span');
 arrow.className='next-step';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');
 return arrow;
}
function selectMode(mode){
 activeFlow=mode==='intro'?introFlow:flow;
 for(const button of $('lesson-mode').querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
 for(const id of ['payment-steps','relay-step','receipt-steps','mining-steps']){
  const row=$(id);
  for(const child of Array.from(row.children))if(!child.classList.contains('branch-name'))child.remove();
 }
 $('mining-steps').querySelector('.branch-name').textContent=mode==='intro'?'Bob 的出块侧 → 收款确认':'矿池出块至 Bob 确认';
 activeFlow.forEach(([name,kind],i)=>{
 const button=document.createElement('button');
 button.textContent=(i+1)+' '+name;
 button.style.borderBottom='3px solid '+colors[kind];
 button.onclick=()=>show(i);
 if(i<2) $('payment-steps').append(button,stepArrow());
 else if(i===2) $('relay-step').append(button);
 else if(i===3) $('receipt-steps').append(button);
 else {
  const item=document.createElement('span');
  item.className='chain-item';
  if(i>4) item.append(stepArrow());
  item.append(button);$('mining-steps').append(item);
 }
});
 show(0);
}
for(const button of $('lesson-mode').querySelectorAll('button'))button.onclick=()=>selectMode(button.dataset.mode);
document.addEventListener('keydown',e=>{if($('inspect').open||e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();show(index+(e.key==='ArrowRight'?1:-1))}});
$('full').hidden=!document.fullscreenEnabled;$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'退出全屏':'全屏');selectMode('intro');

function setLessonTheme(mode) {
  const light = mode === 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  const button = document.getElementById('theme');
  button.textContent = light ? '切换深色' : '切换浅色';
  // Carry the setting even when file URLs have isolated storage.
  for (const link of document.querySelectorAll('.course-links a, a[data-lesson]')) {
    const url = new URL(link.href);
    url.searchParams.set('theme', document.documentElement.dataset.theme);
    link.setAttribute('href', url.pathname.split('/').pop() + url.search + url.hash);
  }
}
let lessonTheme = new URLSearchParams(location.search).get('theme');
if (!['light', 'dark'].includes(lessonTheme)) {
  try { lessonTheme = localStorage.getItem('btc-course-theme') || localStorage.getItem('btc-full-node-theme') || localStorage.getItem('btc-wallet-theme'); } catch {}
}
setLessonTheme(lessonTheme);
document.getElementById('theme').onclick = () => {
  setLessonTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  const url = new URL(location.href);
  url.searchParams.set('theme', document.documentElement.dataset.theme);
  try { history.replaceState(null, '', url); } catch {}
  try { localStorage.setItem('btc-course-theme', document.documentElement.dataset.theme); } catch {}
};
