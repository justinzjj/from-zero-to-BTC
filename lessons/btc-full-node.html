<p id="description">B 花费 U 的 100,000 聪，付给 Bob 60,000 聪，找零 39,000 聪，手续费 1,000 聪。点选模块可查看知识目录和它收发的数据。</p><p><a href="btc-utxo.html" target="_blank" rel="noopener">打开 UTXO 专题 · 跟踪 U 的占用、花费与恢复 ↗</a></p><section id="module-overview" aria-label="模块内部说明" hidden><dl>

<template id="explain-delivery"><h3>这笔交易会去哪里？</h3><ul><li>已经知道 B 的通告可直接忽略，无需再下载。收到无法解码的载荷，消息解析失败；能解码但结构或签名无效的交易会被拒绝。</li><li>通过基本检查但缺前序输入的 P2P 交易，在满足暂存条件时可进有限的孤儿交易池，节点尝试索取父交易，取得后重试。孤儿池可淘汰条目；仅凭查不到 U，无法断定 U 是已花还是父交易尚未到达。</li><li>输入齐全后才可能接纳。普通独立交易须通过有效性和本地策略检查。若首次在区块里看到 B，直接按块规则验证；coinbase 只能作为区块首笔交易。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/node/txdownloadman_impl.cpp" target="_blank" rel="noopener">Core v29.0 · 缺输入交易的处理 ↗</a></p></template>
<template id="explain-checks"><h3>拿着 B 逐项核对</h3><ul><li>① 格式与重量：能否按协议解析？输入和输出是否非空？输入有无重复 outpoint？单笔基础大小能否装入共识允许的区块？普通标准交易另有 400,000 WU 重量上限。</li><li>② 输入与金额：从活动链 UTXO 或可用的池内父交易找每个旧输出，读取金额和脚本。检查金额非负、各项和总额在范围内，输入总额至少覆盖输出总额。本例 100,000 − 60,000 − 39,000 = 1,000 聪，差额就是手续费。</li><li>③ 时间与资格：检查绝对和相对时间锁；若输入来自 coinbase，还需检查高度差是否至少 100。</li><li>④ 脚本与签名：逐个输入按前序输出的条件执行。本例核对原生 P2WPKH 的空 scriptSig、两项见证、公钥哈希，并按 BIP143 重算摘要，用公钥验 ECDSA 签名。签名正确只证明授权。</li><li>⑤ 双花：链上已经花掉的 U 在当前 UTXO 中不可用。另查本地池是否有交易引用同一个 outpoint；即使两笔签名都对，也必须解决冲突。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/consensus/tx_verify.cpp" target="_blank" rel="noopener">Core v29.0 · 前序输出与金额检查 ↗</a> · <a href="btc-utxo.html" target="_blank" rel="noopener">用 U 对照节点状态 ↗</a></p></template>
<template id="explain-policy"><h3>本地策略怎样得出接纳或拒绝？</h3><ul><li>先查本机的 outpoint → 花费交易索引。C 是假设的另一笔交易：只有 C 的某个输入也引用 U，才与 B 冲突。同一地址的两个不同输出可以分别花费。若 C 已在池中，按替换规则决定是否移除 C 及受影响的后代；若 C 已在活动链花掉 U，B 缺少可用输入。</li><li>普通单笔交易要满足节点接受的标准脚本形式、标准重量和粉尘策略。粉尘按输出类型与估计花费成本判断；v29.0 另有受限的临时粉尘规则。标准策略失败的交易仍可能被矿工收入符合共识的区块。</li><li>Core v29.0 默认最低中继费率为 1 sat/vB。用 bitcoin-cli getmempoolinfo 查本机 minrelaytxfee 和 mempoolminfee，单位 BTC/kvB；0.00001000 BTC/kvB = 1 sat/vB。池受容量压力时有效门槛可上升。</li><li>假设 B 的实际虚拟大小为 141 vB，1,000 ÷ 141 ≈ 7.09 sat/vB。若普通单笔接纳门槛从 1 升到 8 sat/vB，需要 1,128 聪，B 差 128 聪。提高费率通常提高竞争力；等待几个块仍取决于矿工模板、竞争交易和新区块到达时间。</li><li>全部通过才在本地池写入 B 和 U → B。此时活动链 UTXO 里仍有 U；其他节点也可以有不同的内存池。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/policy/policy.h" target="_blank" rel="noopener">Core v29.0 · 标准性与费率常量 ↗</a> · <a href="https://bitcoincore.org/en/doc/29.0.0/rpc/blockchain/getmempoolinfo/" target="_blank" rel="noopener">读本机费率门槛 ↗</a> · <a href="btc-utxo.html" target="_blank" rel="noopener">用 U 对照节点状态 ↗</a></p></template>
<template id="explain-template"><h3>本地池怎样填进候选块？</h3><ul><li>Core v29.0 比较候选交易和仍需一同选入的未确认祖先，以包的费用和虚拟大小衡量收益。父先子后。假设父付 200 聪占 200 vB，子付 1,800 聪占 200 vB，合在一起是 5 sat/vB；不能只取看起来有 9 sat/vB 的子交易。</li><li>检查包是否达到模板最低费率，是否满足最终性，以及剩余重量和签名操作预算。共识上限为整块 4,000,000 WU、80,000 sigops cost；模板还为 coinbase 等保留空间。池接纳已处理同一 outpoint 的冲突；最终整块验证仍逐笔检查。</li><li>选中一包后，更新后代尚需带入的祖先、费用和大小。某包放不下时可继续尝试其他合适候选；构造模板只读取池，落选者通常仍在池中等下一轮。交易也可能因替换、过期、容量淘汰或链上冲突而离池。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/node/miner.cpp" target="_blank" rel="noopener">Core v29.0 · 模板挑选与更新 ↗</a></p></template>
<template id="explain-proof"><h3>Bob 为什么采用这一支？</h3><ul><li>节点从父链按难度规则推算本位置应填的 nBits，解出目标 T，再对 80 字节区块头做双 SHA-256，将结果按整数与 T 比较。哈希 ≤ T 才达到要求。命中头以后还要验证整块。</li><li>每个有效块贡献 floor(2²⁵⁶ ÷ (T + 1)) 的工作量。节点沿父指针逐块累加，在已知可验证的有效分支中选择累计工作量最大的一支。同目标下，哈希再小也不会多记工作量。</li><li>同父两块 K 和 L1 同时有效且等工作量时，节点可暂时各用一支。若 L1 的有效后继 L2 使累计工作量领先，Bob 才切换。块数相同也可能因难度不同而有不同工作量。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/chain.cpp" target="_blank" rel="noopener">Core v29.0 · 单块工作量 ↗</a></p></template>
<template id="explain-header"><h3>收到别人挖出的块</h3><ul><li>邻居可通告区块头或紧凑块；节点取得缺少的交易，重建完整块。核对父块、预期 nBits、PoW、时间戳等条件；父链数据不足时先补齐。已记录头或存有块体，并不代表已经采用。</li><li>核对头内 Merkle 根与有序交易是否一致，检查重量、coinbase 的位置和见证承诺等。即使本机从未见过 B，也能从 K 取得它。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/pow.cpp" target="_blank" rel="noopener">Core v29.0 · 区块头目标检查 ↗</a></p></template>
<template id="explain-block"><h3>按父块状态验每一笔交易</h3><ul><li>从父块 P 的 UTXO 视图开始，按交易顺序核对格式、输入可用性、金额、时间条件和脚本。适用时可复用已验证的脚本缓存结果。矿工声称验过，不能代替 Bob 自己的验证规则。</li><li>先执行 B 会花掉 U，添加 B:0 与 B:1。若 K 后面还有 C 引用 U，此时已经查不到 U，整块失败。最后核对 sigops 成本及 coinbase 总额不超过本高度补贴加全块手续费；入池费率和标准性不参与这项共识判断。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/validation.cpp" target="_blank" rel="noopener">Core v29.0 · 区块验证 ↗</a></p></template>
<template id="explain-commit"><h3>什么时候真正改变本机账本？</h3><ul><li>只有有效块被接到活动链，才推进链尖和已确认 UTXO 状态。节点维护块索引、块体位置和撤销记录，清理池内已确认或冲突的交易，并通知钱包。有效侧支可保留，等待累计工作量比较。</li><li>若切换到另一条更重的有效分支，先找到共同祖先，逆序断开旧块，撤掉其新输出并恢复旧 Coin；再正序连接新块。旧块中的普通交易按新状态复查，只有仍满足条件者才可能回池。</li></ul><p><a href="https://github.com/bitcoin/bitcoin/blob/v29.0/src/validation.cpp" target="_blank" rel="noopener">Core v29.0 · 活动链连接与回滚 ↗</a> · <a href="btc-utxo.html" target="_blank" rel="noopener">用 U 对照节点状态 ↗</a></p></template>

 for(const card of catalog[key]){

    const term=document.createElement('dt'),definition=document.createElement('dd');
    term.textContent=title;definition.textContent=text;body.append(term,definition);
   }
   const source=byId('cardSource');
   source.hidden=!card.source;
   if(card.source){
    source.href='https://github.com/bitcoin/bitcoin/blob/f490f5562d4b20857ef8d042c050763795fd43da/src/'+card.source;

   }

   [resource.textContent,resource.href]=card.resource;

 }

let lessonTheme = new URLSearchParams(location.search).get('theme');
if (!['light', 'dark'].includes(lessonTheme)) {
  try { lessonTheme = localStorage.getItem('btc-course-theme') || localStorage.getItem('btc-full-node-theme') || localStorage.getItem('btc-wallet-theme'); } catch {}
}
setLessonTheme(lessonTheme);
document.getElementById('theme').onclick = () => {
  setLessonTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  const url = new URL(location.href);
  url.searchParams.set('theme', document.documentElement.dataset.theme);
  try { history.replaceState(null, '', url); } catch {}
  try { localStorage.setItem('btc-course-theme', document.documentElement.dataset.theme); } catch {}
};
</script>
