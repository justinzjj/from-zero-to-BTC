const cards={

P2:[
['选入 B 并固定交易顺序','父块、交易池候选交易、依赖、费用和资源限制。','选择可共同纳入块的交易，祖先先于后代。coinbase 占第 0 个位置。','P3 收到有序的完整交易、父块、费用和奖励材料。','P2 选入 B，B 的 1,000 聪计入可领取的总额。','漏掉 B 所依赖的未确认父交易，验块时会找不到旧输出。','miner','vis13'],
['把 B 的见证承诺进块','交易的 txid、含见证的 wtxid、32 字节见证保留值。D 表示双 SHA-256，|| 表示拼接。','普通树按 txid 构造。见证树按 wtxid 构造，coinbase 叶子取 32 字节零。将 D(见证根 || 保留值) 写入 coinbase 承诺输出。','P3 保留见证材料。承诺输出参与 coinbase txid 计算，M2 最终算出头中的普通根。','B 的见证 → wtxid → 见证根 → coinbase 输出 → coinbase txid → 头中根。','见证数据遭到篡改时，原 txid 可能仍然匹配，但见证承诺校验会失败。','bip','vis12']],
P3:[
['把完整模板转换为作业 J','P2 模板、池方的 coinbase 构造材料。','为模板分配 J，给额外 nonce 留出位置，计算 coinbase 到普通根的兄弟哈希。保留完整交易顺序、见证材料及作业参数。','M1 收到 mining.notify(J, prevhash, coinb1, coinb2, merkle_branch, version, nBits, nTime, clean_jobs)。','B 的两个输出和见证留在池方，矿机凭分支算根。','若用新交易序列覆盖仍有效的 J，之后就无法可靠重建原块。','sv1','vis15']],

['用五个参数提交结果','工人名、J、extraNonce2、nTime、nonce。','固定版本部署发送 mining.submit(worker, J, extraNonce2, nTime, nonce)，按请求 ID 匹配答复。','P3 从会话找回 extraNonce1，从 J 找回父块、分支和版本，交 P4 复算。','a 与 b 使用同一个提交入口和字段格式。','将板内任务号 L 填入 J 的位置，矿池可能找不到作业。','sv1','vis15']],

['用完一轮 nonce 后换搜索空间','仍有效的 J，固定前 76 字节的全部 2³² 个 nonce 已搜完。','M2 改 extraNonce2，重算 coinbase txid 和普通根。见证保留值和其他交易固定，见证树的 coinbase 叶子取零，因此原见证承诺仍可使用。','M3 派发新的本地任务，H1 可重新从 nonce 0 开始。池方允许时控制器也可更新时间，P3 可换模板或父块。','教学中的 a、b 同属换 extraNonce2 之前的 L，版本固定。','只把 nonce 绕回零，其他字段相同，将重复此前的搜索。','bip','esp','vis14']],

['用 L 分派任务并认回结果','固定头字段、J、extraNonce2、时间和份额目标。','登记 L 到原作业参数的映射，派发计算任务。收到 (L, nonce) 后按 L 查表，复算头哈希并检查份额目标。','合格结果交 M1，使用池方作业号 J 提交。','(L, a) 与 (L, b) 查同一条记录。板内任务按逻辑字段示意，具体封包随机型变化。','过早复用 L，迟到的回报会被配到另一个头上。','esp','vis15']],
H1:[
['对一个 nonce 究竟算什么','当前任务的固定头数据和一个具体 nonce。','教学伪代码：digest = SHA256(SHA256(header80))。第二次输入是首次摘要的 32 个原始字节。芯片可并行搜索并复用固定部分的中间计算。','满足芯片回报条件时，向 M3 回报 L 和候选 nonce。回报门槛依机型与配置而定。','暂停①。H1 无需读取 B 的金额或见证。btcd 的 solveBlock 示范 CPU 上的搜索逻辑。','将第一次摘要转成 64 个十六进制字符再哈希，会得到错误结果。','btcd','vis14']],
P4:[
['手算两个目标，再换成真实目标','先手算：哈希取 0…99，份额目标 20，网络目标 3。对 21、20、3、0 分别判断两次 ≤。','21：都未达到。20（来自 a）：达到份额目标。3（来自 b）与 0：两个都达到。\n真实 h = int.from_bytes(双 SHA-256 的原始摘要, "little")。网络目标从 nBits 解码并受共识约束，份额目标取适用于 J 的值。','网络目标 < h ≤ 份额目标时 P4 只记工，h ≤ 网络目标时还要重建 K。','暂停②。20 和 3 是手算用的哈希值，a、b 是 nonce。此时 Bob 为 0。','用严格小于号会错判恰好等于门槛的结果。','pow','vis14'],
['重建、复算与去重','提交五参数、会话 extraNonce1、J 的 coinbase 两段、分支、版本、父块、nBits 和份额目标。','检查作业有效、字段长度、时间范围，重建头并复算。教学部署以完整 80 字节头识别同一结果，原子地登记已接受结果并记工。','P4 更新唯一份额记录；P3 向 M1 返回接受或拒绝。网络命中还进入组块。','答复丢失后重发 a 只记一次。b 的头与 a 不同。','若仅用 nonce 去重，两个不同 extraNonce2 的任务都报 nonce 7 时会误删有效工作。','sv1','pow','vis15'],
['从命中头重建完整 K','已核实的网络命中、J 的原模板、命中参数、有序完整交易与见证材料。','恢复含见证保留值的完整 coinbase，将它置于块首，按原顺序接上 B 等交易。重算普通根，与命中头核对。','完整 K 交 P1 验证与传播。','矿池保存当时的交易和顺序，矿机补齐该次 extraNonce2、时间和 nonce b。','若临时加入新到的高费交易，块体的根会与命中头不符。','merkle','bip','vis13']],
V1:[
['Bob 在哪一步看到一次确认','经 P2P 收到的完整 K、Bob 自己的父链、UTXO 集和共识规则。','独立验证并选择累计工作量最大的有效链。本例 K 接到当前链尖。确认数 = 活动链尖高度 − B 所在块高度 + 1。','V1 采用 K 后，钱包显示 B:0 的 60,000 聪为 1 次确认。','暂停③。收到尚未采用时为 0，采用时链尖就是 K，因此为 1。','若 K 只在侧支，活动链未包含 B，Bob 的钱包仍显示 0。','validation','vis16']]
};
function frames(network){
 const n=network?'b':'a';
 const list=[
 ['template','前情 1　选入 B','P2 收到 P1 的链尖和交易池中的完整 B。','依据依赖与资源约束选入 B，统计 1,000 聪费用，准备见证承诺。','新模板保留父块和有序交易，交给 P3。'],
 ['job','前情 2　生成 J','P3 收到 P2 的含 B 模板，已有矿池会话。','生成 coinbase 两段及 Merkle 分支，并为模板分配作业号 J。','登记 J 与原模板的对应关系，向 M1 下发作业。'],
 ['notify','1　矿池下发作业','M1 收到 mining.notify 中的 J、前块哈希、coinbase 两段、分支、版本、nBits、时间及清理标志。','结合已有的 extraNonce1、extraNonce2 长度和适用的份额难度。','登记活动作业 J，把构造材料和份额目标交 M2。'],
 ['prepare','2　准备候选头','M2 收到 J 及会话参数，已有本地 extraNonce2 分配状态。','选定 extraNonce2，拼 coinbase 的无见证序列化，算 txid，沿分支算普通 Merkle 根。','生成固定头字段，连同原作业参数与份额目标交 M3。'],
 ['allocate','3　分配本地任务','M3 收到候选头数据，已有可用本地任务号。','给这一批头分配任务号 L。','登记 L 与 J、固定头字段、extraNonce2、时间、份额目标的对应关系，准备派发。'],
 ['search','4　芯片找到候选 nonce','H1 收到 L、固定头数据和起始 nonce。','改变 nonce，反复计算 80 字节头的双 SHA-256。','芯片得到候选 nonce '+n+'，等待向 M3 回报。此刻矿池尚未收到提交。','暂停① · 芯片找到结果'],
 ['report','5　芯片回报','M3 收到 (L, '+n+')，手中有本地任务表。','查 L 找回固定头字段，填回 nonce，复算并检查份额目标。','生成待提交参数，交给 M1。'],
 ['client','6　准备提交','M1 收到 J、extraNonce2、时间和 nonce '+n+'，已有工人名与会话。','组成五参数 mining.submit 请求。','登记待答复请求，发往 P3。'],
 ['submit','7　矿池接收','P3 收到五参数提交，保存着会话与 J 的原模板。','找回 extraNonce1、适用份额目标和作业参数。','将该提交与原模板配对，送 P4 复算；尚未记工。'],
 ['verify','8　'+(network?'网络目标也命中':'普通份额记工'),'P4 收到上下文和提交值，已有份额记录与两个目标。','确认作业有效且结果未重复，重建 coinbase、根和头，复算同一个哈希。'+(network?'哈希 ≤ 网络目标，也达到份额目标。':'网络目标 < 哈希 ≤ 份额目标。'),network?'新记一份有效份额，恢复完整 coinbase 和有序交易，重建 K，准备交 P1。':'工人新增一份已接受份额。停在这里：哪份记录变了？Bob 为什么仍为 0 次确认？','暂停② · 矿池复算结果']
 ];
 if(network)list.push(
 ['block','9　池方验块并传播','P1 收到完整 K，已有父链、UTXO 集和验证规则。','核验头、PoW、交易、见证承诺和奖励金额。本例 K 有效并延长活动链。','池方链尖成为 K，向 P2P 邻居传播。Bob 尚未采用。'],
 ['peer','10a　Bob 收到 K','V1 经 P2P 收到完整 K。自己的活动链尖仍是 P，钱包已记录 B:0。','将 K 交给本地验证路径。先停在采用之前读出确认数。','接收方手中已有块体；本地活动链仍指向 P。'],
 ['peer','10b　Bob 采用 K','同一条 P2P 消息的接收方 V1 手中已有完整 K 和自己的父链状态。','独立验证并选择包含 K 的有效链，本例 K 成为链尖。','V1 更新活动链并通知钱包，B:0 的 60,000 聪变为 1 次确认。','暂停③ · Bob 采用区块']
 );return list;
}
const flows={share:frames(false),block:frames(true)};
const positions={share:2,block:2};
let mode='arch',moduleId='',cardIndex=null,trigger=null;
function html(parent,tag,content){
 const e=document.createElement(tag);e.textContent=content;parent.append(e);return e;
}
function pairs(parent,rows,css){
 const dl=html(parent,'dl','');if(css)dl.className=css;
 for(const [label,value] of rows){
 const wrap=html(dl,'div','');html(wrap,'dt',label);html(wrap,'dd',value);
 }
}
function render(){
 const walk=mode!=='arch',i=positions[mode],frame=walk?flows[mode][i]:null;
 for(const t of document.querySelectorAll('[data-mode]'))t.setAttribute('aria-pressed',String(t.dataset.mode===mode));
 $('controls').hidden=!walk;$('map').classList.toggle('playing',walk);
 for(const e of document.querySelectorAll('.edge')){
 const active=walk&&frame[0]===e.dataset.edge;
 const id=e.dataset.edge;
 const nonce=mode==='block'?'b':'a';
 const messages={submit:'mining.submit · worker, J, extraNonce2, nTime, nonce '+nonce,report:'L, '+nonce,client:'J、extraNonce2、nTime、nonce '+nonce,peer:'P2P · 完整 K',block:'提交完整候选块 K',notify:'mining.notify · J、coinbase 两段、分支与头字段'};
 e.querySelector('text').textContent=active&&messages[id]?messages[id]:edges[id][3];
 e.classList.toggle('active',active);e.firstChild.setAttribute('marker-end',active?'url(#current)':'url(#arrow)');
 }
 const focus=mode==='share'?['H1','P4']:mode==='block'?['H1','P4','V1']:[];
 for(const node of document.querySelectorAll('.module'))node.classList.toggle('core',focus.includes(node.dataset.id));
 $('credit').textContent=walk&&i>=9?'已接受 1 份':'已接受 0 份';
 $('tip').textContent=mode==='block'&&i>=10?'K':'P';
 $('bob').textContent=mode==='block'&&i===12?'1 次确认':'0 次确认';
 $('story').replaceChildren();
 if(!walk){
 $('mark').textContent='Stratum V1 · 固定版本';$('title').textContent='从 P3 → M1 的作业读起';
 html($('story'),'p','矿池保留完整 B，经网络下发 J。控制板用 J 准备候选头，再把本地任务 L 交给 ASIC。板内接口按教学逻辑字段表示。点选模块可查看它维护的数据。');return;
 }
 const steps=$('stage-list');
 if(steps.dataset.mode!==mode){
 steps.dataset.mode=mode;steps.replaceChildren();
 flows[mode].forEach((f,j)=>{
 const btn=html(steps,'button',f[1]);btn.onclick=()=>{positions[mode]=j;render()};
 });
 }
 [...steps.children].forEach((btn,j)=>btn.setAttribute('aria-current',j===i?'step':'false'));
 $('prev').disabled=i===0;$('next').disabled=i===flows[mode].length-1;
 $('mark').textContent=frame[5]||('当前消息 · '+edges[frame[0]][3]);
 $('title').textContent=frame[1];
 pairs($('story'),[['收到与已有',frame[2]],['处理',frame[3]],['状态与去向',frame[4]]],'steps');
 if(mode==='share'&&i===9){
 const btn=html($('story'),'button','同一作业 J · 从芯片回报 nonce b 继续 →');
 btn.onclick=()=>{positions.block=6;mode='block';render()};
 }
}
for(const btn of document.querySelectorAll('[data-mode]'))btn.onclick=()=>{mode=btn.dataset.mode;render()};
$('prev').onclick=()=>{positions[mode]--;render()};
$('next').onclick=()=>{positions[mode]++;render()};

function openModule(id){
 moduleId=id;trigger=document.querySelector('[data-id="'+id+'"]');showInfo(null);$('info').showModal();
}
function showInfo(index){
 cardIndex=index;
 const mod=modules[moduleId],body=$('body'),inCard=index!==null;
 body.replaceChildren();$('crumb').textContent=moduleId+' · '+mod[2];
 $('back').textContent=inCard?'返回知识目录':(mode==='arch'?'返回架构图':'返回暂停步骤');
 if(inCard){
 const [title,input,method,output,place,fail,...refs]=cards[moduleId][index];
 $('infoTitle').textContent=moduleId+'.'+(index+1)+'　'+title;
 pairs(body,[['输入',input],['处理',method],['输出与使用方',output],['在 B / K 中的位置',place],['失败例',fail]]);
 for(const ref of refs){const [name,url]=sources[ref];const link=html(body,'a',name+' ↗');link.href=url;link.target='_blank';link.rel='noopener'}
 }else{
 $('infoTitle').textContent=mod[2];pairs(body,[['内部组成',mod[4]],['维护的数据',mod[5]],['主要功能',mod[6]]]);
 html(body,'h3','知识点目录');
 cards[moduleId].forEach(([name],j)=>{const btn=html(body,'button',moduleId+'.'+(j+1)+'　'+name);btn.className='topic';btn.onclick=()=>{showInfo(j);$('back').focus()}});
 }
 $('info').scrollTop=0;
}
function stepBack(){
 if(cardIndex===null){$('info').close();trigger.focus({preventScroll:true})}
 else{const old=cardIndex;showInfo(null);document.querySelectorAll('.topic')[old].focus()}
}
$('back').onclick=stepBack;
$('info').oncancel=e=>{e.preventDefault();stepBack()};
render();

function setLessonTheme(mode) {
  const light = mode === 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  const button = document.getElementById('theme');
  button.textContent = light ? '切换深色' : '切换浅色';
  // Carry the setting even when file URLs have isolated storage.
  for (const link of document.querySelectorAll('.course-links a, a[data-lesson]')) {
    const url = new URL(link.href);
    url.searchParams.set('theme', document.documentElement.dataset.theme);
    link.setAttribute('href', url.pathname.split('/').pop() + url.search + url.hash);
  }
}
let lessonTheme = new URLSearchParams(location.search).get('theme');
if (!['light', 'dark'].includes(lessonTheme)) {
  try { lessonTheme = localStorage.getItem('btc-course-theme') || localStorage.getItem('btc-full-node-theme') || localStorage.getItem('btc-wallet-theme'); } catch {}
}
setLessonTheme(lessonTheme);
document.getElementById('theme').onclick = () => {
  setLessonTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  const url = new URL(location.href);
  url.searchParams.set('theme', document.documentElement.dataset.theme);
  try { history.replaceState(null, '', url); } catch {}
  try { localStorage.setItem('btc-course-theme', document.documentElement.dataset.theme); } catch {}
};
</script>
