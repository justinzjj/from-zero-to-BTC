<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc"><title id="title">知识覆盖图 1 · 从一笔付款到一个系统</title><desc id="desc"></desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#edf0f5}.small{font-size:17px;fill:#b2bac6}.label{font-size:20px}.title{font-size:32px;font-weight:650}.module{cursor:pointer}.module.dim{opacity:.2}.module.selected rect{stroke:#efc478;stroke-width:4}.module:focus rect{stroke:#a9ceff;stroke-width:4}a:focus rect{stroke:#a9ceff;stroke-width:4}</style><rect width="1440" height="730" fill="#202328"/><text x="40" y="55" class="title">知识覆盖图 1 · 从一笔付款到一个系统</text><text x="40" y="89" class="small"></text><g class="stage" data-stage="0" role="button" tabindex="0" aria-label="第1至4讲 基础账本"><rect x="40" y="90" width="430" height="220" rx="8" fill="#30343b" stroke="#4b515c"/><text x="62" y="126" class="small">第 1—4 讲</text><text x="62" y="168" font-size="27">基础账本</text><text x="62" y="207" class="small">编码 → 授权 → UTXO → 验证</text><path d="M62 235H448" stroke="#4b515c"/><text x="62" y="274" font-size="23" style="fill:#88d5bc">可验证的付款</text></g><text x="428" y="128" class="small">01</text><g class="stage" data-stage="1" role="button" tabindex="0" aria-label="第5至8讲 钱包能力"><rect x="505" y="90" width="430" height="220" rx="8" fill="#30343b" stroke="#4b515c"/><text x="527" y="126" class="small">第 5—8 讲</text><text x="527" y="168" font-size="27">钱包能力</text><text x="527" y="207" class="small">地址 → 见证 → 密钥 → 选币</text><path d="M527 235H913" stroke="#4b515c"/><text x="527" y="274" font-size="23" style="fill:#88d5bc">可构造的交易</text></g><text x="893" y="128" class="small">02</text><g class="stage" data-stage="2" role="button" tabindex="0" aria-label="第9至12讲 单机区块链"><rect x="970" y="90" width="430" height="220" rx="8" fill="#30343b" stroke="#4b515c"/><text x="992" y="126" class="small">第 9—12 讲</text><text x="992" y="168" font-size="27">单机区块链</text><text x="992" y="207" class="small">Merkle → 区块 → 交易池 → PoW</text><path d="M992 235H1378" stroke="#4b515c"/><text x="992" y="274" font-size="23" style="fill:#88d5bc">可挖矿的历史</text></g><text x="1358" y="128" class="small">03</text><g class="stage" data-stage="3" role="button" tabindex="0" aria-label="第13至16讲 链与钱包联动"><rect x="40" y="355" width="430" height="220" rx="8" fill="#30343b" stroke="#4b515c"/><text x="62" y="391" class="small">第 13—16 讲</text><text x="62" y="433" font-size="27">链与钱包联动</text><text x="62" y="472" class="small">选链 → 重组 → 事件 → 钱包接口</text><path d="M62 500H448" stroke="#4b515c"/><text x="62" y="539" font-size="23" style="fill:#88d5bc">可恢复的状态</text></g><text x="428" y="393" class="small">04</text><g class="stage" data-stage="4" role="button" tabindex="0" aria-label="第17至19讲 多节点运行"><rect x="505" y="355" width="430" height="220" rx="8" fill="#30343b" stroke="#4b515c"/><text x="527" y="391" class="small">第 17—19 讲</text><text x="527" y="433" font-size="27">多节点运行</text><text x="527" y="472" class="small">传输 → 同步 → 持久化</text><path d="M527 500H913" stroke="#4b515c"/><text x="527" y="539" font-size="23" style="fill:#88d5bc">可通信与重启</text></g><text x="893" y="393" class="small">05</text><g class="stage" data-stage="5" role="button" tabindex="0" aria-label="第20至22讲 综合与扩展"><rect x="970" y="355" width="430" height="220" rx="8" fill="#30343b" stroke="#4b515c"/><text x="992" y="391" class="small">第 20—22 讲</text><text x="992" y="433" font-size="27">综合与扩展</text><text x="992" y="472" class="small">攻击实验 → 矿池模拟 → 完整演示</text><path d="M992 500H1378" stroke="#4b515c"/><text x="992" y="539" font-size="23" style="fill:#88d5bc">可验收的系统</text></g><text x="1358" y="393" class="small">06</text><text x="40" y="680" class="label">运行 3 个节点、2 个钱包，完成付款、分叉、重组与恢复。</text></svg>