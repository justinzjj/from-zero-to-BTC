<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从零构建区块链 · 课程展示</title>
<style>
:root{color-scheme:dark;--bg:#202328;--panel:#30343b;--line:#4b515c;--text:#edf0f5;--muted:#b2bac6;--practice:#88d5bc;--theory:#9fc9ed;--optional:#b8a4df;--focus:#efc478}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:26px 30px 45px}h1{font-size:34px;letter-spacing:-.5px;line-height:1.3;margin:0 0 12px}h2{font-size:23px;margin:0}h3{font-size:18px;margin:0 0 6px}p{margin:8px 0}header{display:flex;justify-content:space-between;gap:25px;align-items:start;margin-bottom:25px}header p{max-width:920px;color:var(--muted)}a{color:var(--theory);text-underline-offset:4px}.links{min-width:190px;text-align:right;font-size:14px}.links a{white-space:nowrap}nav{display:flex;gap:7px;flex-wrap:wrap;background:var(--bg);position:sticky;top:0;padding:12px 0;z-index:5;border-block:1px solid var(--line)}button,select{font:inherit;color:var(--text);border:1px solid var(--line);background:#292d34;padding:7px 13px;border-radius:5px}button{cursor:pointer}button:hover{background:#3a414b}button[aria-pressed=true]{border-color:var(--theory);background:#3a4d60}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 0}.toolbar label{display:flex;gap:8px;align-items:center}.toolbar select{max-width:410px}.toolbar .spacer{flex:1}.note{color:var(--muted);font-size:14px}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.stages button{font-size:14px}.section-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:15px 0}.section-top a{white-space:nowrap;font-size:14px}.table-wrap{overflow:auto;container-type:inline-size;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px;font-size:15px}caption{text-align:left;padding:12px 16px;color:var(--muted);font-size:14px}thead th{text-align:left;position:sticky;top:0;background:#3a4049;z-index:2;padding:13px 16px;border-bottom:1px solid var(--line)}td,tbody th{padding:14px 16px;vertical-align:top;border-bottom:1px solid #424850;text-align:left;font-weight:400}tbody th{position:sticky;left:0;background:#292d34;z-index:1;width:22%;min-width:220px}td{width:26%;background:#262a30}thead th:first-child{left:0;z-index:3}.course-no{font-size:13px;color:var(--theory);display:block}.course-name{background:none;padding:0;border:0;text-align:left;line-height:1.6}.ability{color:#d3eadf}tr.selected td,tr.selected th{background:#39434d}.tags{font-size:12px;color:var(--muted);margin-top:4px}.chart{border:1px solid var(--line);border-radius:8px;overflow:auto}.chart svg{display:block;width:100%;height:auto;min-width:900px}.chart.fit svg{min-width:0}.chart .stage{cursor:pointer}.chart .stage:focus rect,.chart .stage:hover rect{stroke:#efc478;stroke-width:3}.course-focus,.module-detail{background:var(--panel);border:1px solid var(--line);padding:18px 22px;border-radius:7px;margin:12px 0 20px}.course-focus{border-left:4px solid var(--theory)}.module-detail{border-left:4px solid var(--focus)}.chip{font-size:13px;padding:4px 8px;margin:4px 4px 0 0}.topicgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.topicgrid>div{border-top:1px solid var(--line);padding-top:10px}.topicgrid p{font-size:14px}.practice{color:var(--practice)}.theory{color:var(--theory)}.optional{color:var(--optional)}.electives{margin-top:25px}.elective-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.elective-grid article{background:#292d34;border-top:2px solid #76658e;padding:15px}.elective-grid p{color:var(--muted);font-size:14px}.end-result{border-top:1px solid var(--line);padding-top:20px;margin-top:25px;font-size:18px}footer{margin-top:26px;color:var(--muted);font-size:13px}[hidden]{display:none!important}@media(max-width:800px){main{padding:18px 12px}h1{font-size:28px}header{display:block}.links{text-align:left}.toolbar select{max-width:70vw}.topicgrid,.elective-grid{grid-template-columns:1fr}.section-top{align-items:flex-start}.section-top h2{font-size:20px}nav button{font-size:14px;padding:6px 9px}}@media print{@page{size:A4 landscape;margin:12mm}body{background:white;color:black}main{padding:0}nav,.toolbar,.stages,.links,.section-top a,.course-focus,.module-detail,footer{display:none!important}.view[hidden]{display:block!important}.view{break-before:page}#syllabus{break-before:auto}table{min-width:0;font-size:10px}thead{display:table-header-group}thead th,tbody th,td{position:static;background:white;color:black;padding:6px;border-color:#ccc}.table-wrap{overflow:visible;border:0}tr{break-inside:avoid}tbody th{min-width:0}.course-name{color:black}table .ability{color:black}.chart{overflow:visible;border:0}.chart svg{min-width:0}.elective-grid{grid-template-columns:repeat(3,1fr)}.elective-grid article{background:white;color:black}.elective-grid p{color:#333}.note,header p{color:#444}}
</style>
<main><header><div><h1>从零构建区块链</h1><p>22节必修，沿着同一个项目逐步构建钱包、账本、全节点与网络。</p></div><div class="links"><a href="课程大纲.md">课程大纲 · Markdown</a><br><a href="课程大纲.md#逐讲详情">详细备课大纲</a> · <a href="课程覆盖审计.html">覆盖审计</a><br><a href="resources/从零构建区块链-课程大纲与知识覆盖图.pdf">下载 PDF</a></div></header>
<nav aria-label="展示内容"><button data-view="syllabus" aria-pressed="true">课程大纲</button><button data-view="progress" aria-pressed="false">图1 · 能力进阶</button><button data-view="modules" aria-pressed="false">图2 · 模块覆盖</button><button data-view="depth" aria-pressed="false">图3 · 知识分层</button></nav>
<div class="toolbar"><label for="lesson">聚焦课程 <select id="lesson"><option value="0">全部22节必修</option></select></label><button id="reset">恢复总览</button><span class="spacer"></span><button id="fit" aria-pressed="false">图适应窗口</button></div>
<div id="course-focus" class="course-focus" hidden aria-live="polite"></div>
<section class="view" id="syllabus"><div class="section-top"><h2>课程—概念—代码—能力</h2></div><div class="stages" id="stages" aria-label="按阶段查看"></div><div id="table" class="table-wrap" tabindex="0" role="region" aria-label="22节课展示大纲，可横向滚动"></div><section class="electives"><div class="section-top"><h2>6 个扩展专题</h2></div><div id="electives" class="elective-grid"></div></section><p class="end-result">结课成果：运行 <strong>3个节点＋2个钱包</strong>，完成付款、挖矿、分叉、重组、同步与重启恢复。</p></section>
<section class="view" id="progress" hidden><div class="section-top"><h2>图1 · 每一阶段增加什么能力</h2><a href="resources/01-课程能力进阶.svg" download>下载SVG</a></div><div class="chart" tabindex="0" role="region" aria-label="能力进阶图，可横向滚动">{{SVG1}}</div></section>
<section class="view" id="modules" hidden><div class="section-top"><h2>图2 · 知识落到钱包、全节点与挖矿职责</h2><a href="resources/02-系统模块覆盖.svg" download>下载SVG</a></div><div class="chart" tabindex="0" role="region" aria-label="系统模块图，可横向滚动">{{SVG2}}</div><div id="module-detail" class="module-detail" hidden></div></section>
<section class="view" id="depth" hidden><div class="section-top"><h2>图3 · 基础概念、基础实践与专题扩展</h2><a href="resources/03-知识深度分层.svg" download>下载SVG</a></div><div class="chart" tabindex="0" role="region" aria-label="知识深度分层图，可横向滚动">{{SVG3}}</div></section>
</main>
<script type="application/json" id="data">{{DATA}}</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='syllabus',lesson='0',stage=-1,fit=false,selected=null;
D.rows.forEach(r=>$('lesson').add(new Option(r.id+' · '+r.title,r.id)));
function show(v){view=v;document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!==v);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));$('fit').hidden=v==='syllabus';$('lesson').disabled=v==='depth';if(v==='modules')highlight()}
function table(){let rows=D.rows.filter(r=>stage<0||r.stage===stage);$('table').innerHTML='<table><thead><tr><th scope="col">课程</th><th scope="col">基本概念／算法与数据结构</th><th scope="col">对应代码实践</th><th scope="col">学到什么／积累什么能力</th></tr></thead><tbody>'+rows.map(r=>`<tr class="${lesson===r.id?'selected':''}"><th scope="row"><button class="course-name" data-lesson="${r.id}"><span class="course-no">${r.id.padStart(2,'0')} · ${D.stages[r.stage].name}</span>${esc(r.title)}</button></th><td>${esc(r.concept)}</td><td>${esc(r.practice)}</td><td class="ability">${esc(r.ability)}</td></tr>`).join('')+'</tbody></table>';$('table').querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{selectLesson(b.dataset.lesson);show('modules');$('course-focus').scrollIntoView({block:'start'})})}
function stageButtons(){$('stages').innerHTML='<button data-stage="-1" aria-pressed="'+(stage===-1)+'">全部课程</button>'+D.stages.map((s,i)=>`<button data-stage="${i}" aria-pressed="${stage===i}">${s.start}—${s.end} · ${s.name}</button>`).join('');$('stages').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>selectStage(+b.dataset.stage))}
function selectStage(n){stage=n;lesson='0';$('lesson').value=0;$('course-focus').hidden=true;table();stageButtons();highlight();show('syllabus')}
function selectLesson(id){lesson=id;$('lesson').value=id;const r=D.rows.find(x=>x.id===id);$('course-focus').hidden=!r;if(r){stage=-1;stageButtons();$('course-focus').innerHTML=`<h3>第${r.id}讲 · ${esc(r.title)}</h3><p><strong>代码实践：</strong>${esc(r.practice)}</p><p><strong>积累能力：</strong>${esc(r.ability)}</p>`}table();highlight();moduleDetail()}
function related(m){return lesson==='0'||m.primary.includes(lesson)||m.more.includes(lesson)}
function highlight(){document.querySelectorAll('[data-module]').forEach(g=>{const m=D.modules.find(x=>x.id===g.dataset.module);g.classList.toggle('dim',!related(m));g.classList.toggle('selected',selected===m.id)})}
function moduleDetail(){if(!selected){$('module-detail').hidden=true;return}const m=D.modules.find(x=>x.id===selected);$('module-detail').hidden=false;$('module-detail').innerHTML=`<h3>${esc(m.id+' · '+m.name)}</h3><p>${esc(m.covered)}</p><div>${[...m.primary,...m.more].map(n=>`<button class="chip" data-course="${n}">第${n}讲</button>`).join('')}</div><div class="topicgrid">${['必讲','必做','选修'].map(t=>`<div><h3 class="${t==='必做'?'practice':t==='必讲'?'theory':'optional'}">${({'必讲':'基础概念','必做':'基础实践','选修':'专题扩展'})[t]}</h3>${m.topics.filter(x=>x.tier===t).map(x=>`<p>${esc(x.name)}<br><span class="note">${x.lessons.length?'第'+x.lessons.join('/')+'讲':''}${x.electives.length?' · '+x.electives.join('/'):''}</span></p>`).join('')||'<p class="note">无单列条目；深化入口以其他技术点标注为准。</p>'}</div>`).join('')}</div>`;$('module-detail').querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>selectLesson(b.dataset.course))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('#progress [data-stage]').forEach(g=>{const action=()=>{selectStage(+g.dataset.stage);$('stages').scrollIntoView({block:'start'})};g.onclick=action;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}}});document.querySelectorAll('[data-module]').forEach(g=>{const action=()=>{selected=g.dataset.module;highlight();moduleDetail();$('module-detail').scrollIntoView({block:'start'})};g.onclick=action;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}}});$('lesson').onchange=e=>selectLesson(e.target.value);$('reset').onclick=()=>{selected=null;stage=-1;selectLesson('0');stageButtons()};$('fit').onclick=()=>{fit=!fit;document.querySelectorAll('.chart').forEach(c=>c.classList.toggle('fit',fit));$('fit').setAttribute('aria-pressed',fit);$('fit').textContent=fit?'图保持清晰字号':'图适应窗口'};
$('electives').innerHTML=D.electives.map(c=>`<article><h3><span class="optional">${c.id}</span> · ${esc(c.title)}</h3><p>${esc(c.practice)}</p><span class="note">先修：第${c.prerequisites.join('/')}讲</span></article>`).join('');stageButtons();table();show('syllabus');
</script></html>
